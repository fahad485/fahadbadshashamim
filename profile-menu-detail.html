<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio — Details</title><link rel="stylesheet" href="css/style.css"></head><body><header id="siteHeader" class="site-header"></header><main id="page"></main><footer id="footer" class="footer"></footer><script src="js/data.js"></script><script src="js/main.js"></script><script>async function renderMenuDetail(){try{const r=await fetch(`data/site.json?v=${Date.now()}`);if(!r.ok)throw new Error('Unable to load site data');const site=await r.json();const slug=new URLSearchParams(location.search).get('item');const item=(site.profileMenuItems||[]).find(x=>x.type==='custom' && x.href.includes(`item=${slug}`));const page=document.getElementById('page');const escHtml=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));if(!item){page.innerHTML='<section class="section light"><div class="container"><div class="empty">Page not found.</div></div></section>';return}const title=escHtml(item.title||item.label);const label=escHtml(item.label||'DETAIL');const desc=escHtml(item.description||'');const content=escHtml(item.content||'Use the private dashboard to add detailed content for this section.');document.title=`${item.title||item.label} — ${site.name}`;page.innerHTML=`<section class="detail-hero scientific-bg"><div class="container"><div class="eyebrow">${label}</div><h1>${title}</h1>${desc?`<p style="max-width:720px;color:#c9c4b8">${desc}</p>`:''}</div></section><section class="section light"><div class="container"><article class="detail-main"><h2>${title}</h2><div style="white-space:pre-wrap;line-height:1.85;color:#514c43">${content}</div></article></div></section>`}catch(e){document.getElementById('page').innerHTML='<section class="section light"><div class="container"><div class="empty">Unable to load this page.</div></div></section>'}}renderMenuDetail()</script></body></html>
